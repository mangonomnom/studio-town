<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Studio town: a floating grass island with three little houses and a pink blob avatar saying hi">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E6"/>
      <stop offset="1" stop-color="#F3E3DA"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A47F"/>
      <stop offset="1" stop-color="#B38C68"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="240" height="160" fill="url(#sky)"/>
  <circle cx="198" cy="30" r="13" fill="#E8C5C0" opacity="0.75"/>
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="44" cy="30" rx="17" ry="6"/>
    <ellipse cx="56" cy="26" rx="10" ry="6"/>
    <ellipse cx="150" cy="18" rx="13" ry="4.5"/>
    <ellipse cx="159" cy="15" rx="8" ry="4.5"/>
  </g>
  <g fill="#8FA1B2" opacity="0.45">
    <circle cx="22" cy="62" r="1.2"/>
    <circle cx="214" cy="70" r="1.2"/>
    <circle cx="104" cy="12" r="1"/>
    <circle cx="226" cy="44" r="1"/>
  </g>

  <!-- island underside -->
  <path d="M38 100 C46 118 70 132 96 142 C108 147 122 148 132 142 C160 130 190 118 202 100 Z" fill="url(#earth)" stroke="#5A4A3C" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M70 114 C78 122 90 128 100 131 M142 126 C156 121 170 114 180 106" fill="none" stroke="#5A4A3C" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M112 146 L112 152 M128 143 L128 150" stroke="#C9A47F" stroke-width="2" stroke-linecap="round"/>

  <!-- grass top -->
  <ellipse cx="120" cy="100" rx="84" ry="20" fill="#C4D3A8" stroke="#5A4A3C" stroke-width="1.2"/>
  <path d="M54 104 q2 -4 4 0 M178 98 q2 -4 4 0 M150 112 q2 -4 4 0 M80 112 q2 -4 4 0" fill="none" stroke="#A3AE9A" stroke-width="1" stroke-linecap="round"/>
  <path d="M96 116 C108 110 122 108 136 104" fill="none" stroke="#F7F1E6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- house 1: clay roof, left -->
  <g stroke="#5A4A3C" stroke-width="1" stroke-linejoin="round">
    <path d="M60 78 L80 78 L80 98 L60 98 Z" fill="#F7F1E6"/>
    <path d="M80 78 L90 73 L90 93 L80 98 Z" fill="#E6DCCB"/>
    <path d="M56 79 L70 64 L84 79 Z" fill="#C26D53"/>
    <path d="M70 64 L80 59 L94 74 L84 79 Z" fill="#A85C45"/>
    <rect x="67" y="87" width="6" height="11" fill="#C9A47F"/>
    <rect x="83" y="81" width="4" height="4" fill="#8FA1B2"/>
  </g>

  <!-- house 2: haze roof, tall, back middle -->
  <g stroke="#5A4A3C" stroke-width="1" stroke-linejoin="round">
    <path d="M110 68 L128 68 L128 92 L110 92 Z" fill="#F7F1E6"/>
    <path d="M128 68 L137 64 L137 88 L128 92 Z" fill="#E6DCCB"/>
    <path d="M107 69 L119 54 L131 69 Z" fill="#8FA1B2"/>
    <path d="M119 54 L128 50 L140 65 L131 69 Z" fill="#7B8D9E"/>
    <rect x="114" y="73" width="5" height="5" fill="#E8C5C0"/>
    <rect x="114" y="82" width="5" height="10" fill="#C9A47F"/>
    <rect x="121" y="73" width="5" height="5" fill="#E8C5C0"/>
  </g>

  <!-- house 3: eucalyptus roof, right, with vines -->
  <g stroke="#5A4A3C" stroke-width="1" stroke-linejoin="round">
    <path d="M152 82 L168 82 L168 100 L152 100 Z" fill="#F7F1E6"/>
    <path d="M168 82 L176 78 L176 96 L168 100 Z" fill="#E6DCCB"/>
    <path d="M149 83 L160 71 L171 83 Z" fill="#A3AE9A"/>
    <path d="M160 71 L168 67 L179 79 L171 83 Z" fill="#8E9A86"/>
    <rect x="157" y="90" width="5" height="10" fill="#C9A47F"/>
  </g>
  <path d="M152 99 C150 94 154 90 152 85" fill="none" stroke="#A3AE9A" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="151.5" cy="92" r="1.6" fill="#E8C5C0"/>
  <circle cx="153" cy="86.5" r="1.4" fill="#F7F1E6" stroke="#C26D53" stroke-width="0.5"/>

  <!-- empty plot with a shovel -->
  <ellipse cx="186" cy="104" rx="9" ry="3.5" fill="#C9A47F" opacity="0.7"/>
  <path d="M190 104 L194 92" stroke="#5A4A3C" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M188.6 105.5 L191.4 106.4 L190.4 101.6 Z" fill="#8FA1B2" stroke="#5A4A3C" stroke-width="0.6"/>

  <!-- little me -->
  <ellipse cx="102" cy="113" rx="9" ry="2" fill="#5A4A3C" opacity="0.15"/>
  <path d="M93 110 C92 101 96 96 102 96 C108 96 112 101 111 110 C110 113 94 113 93 110 Z" fill="#E8C5C0" stroke="#5A4A3C" stroke-width="1"/>
  <circle cx="99" cy="103" r="1" fill="#5A4A3C"/>
  <circle cx="105" cy="103" r="1" fill="#5A4A3C"/>
  <path d="M100.5 106 q1.5 1.4 3 0" fill="none" stroke="#5A4A3C" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="96.5" cy="105.5" r="1.3" fill="#C26D53" opacity="0.35"/>
  <circle cx="107.5" cy="105.5" r="1.3" fill="#C26D53" opacity="0.35"/>
  <path d="M102 96 C102 93 102 91 102 89" stroke="#5A4A3C" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M102 90 C98 90 96 87 96 85 C99 85 102 87 102 90 Z" fill="#A3AE9A" stroke="#5A4A3C" stroke-width="0.7"/>
  <path d="M102 89 C105 88 107 85 107 83 C104 83 102 86 102 89 Z" fill="#C4D3A8" stroke="#5A4A3C" stroke-width="0.7"/>

  <!-- speech bubble -->
  <path d="M70 76 C70 70 74 67 80 67 L96 67 C102 67 105 70 105 75 C105 80 102 83 96 83 L95 83 L97 90 L89 83 L80 83 C74 83 70 81 70 76 Z" fill="#FFFFFF" stroke="#5A4A3C" stroke-width="1" stroke-linejoin="round" transform="translate(4 -16)"/>
  <g fill="#5A4A3C" transform="translate(4 -16)">
    <circle cx="80" cy="75" r="1.4"/>
    <circle cx="87.5" cy="75" r="1.4"/>
    <circle cx="95" cy="75" r="1.4"/>
  </g>
</svg>
