[project]
name = "studio-town"
version = "0.1.0"
description = "Your apps as a little hand-drawn town; quiet ones grow wild"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "playwright>=1.40",
]

[project.scripts]
studio-town = "studio_town.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_town"]
